[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartfood"
version = "0.1.0"
description = "Exploración de sistemas de recomendación de recetas con NMF y SVM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyarrow>=12",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "tabulate>=0.9",
    "ipython>=8",
    "ipywidgets>=8",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "nbclient>=0.10", "nbformat>=5.9", "packaging>=23"]

[tool.setuptools.packages.find]
where = ["src"]
