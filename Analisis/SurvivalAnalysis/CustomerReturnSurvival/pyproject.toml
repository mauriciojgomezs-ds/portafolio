[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-return-survival"
version = "0.1.0"
description = "Tiempo hasta una segunda compra"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10", "scikit-learn>=1.3", "pyarrow>=12", "matplotlib>=3.7", "joblib>=1.3", "ipython>=8", "lifelines>=0.30.3", "openpyxl>=3.1"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "nbclient>=0.10", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]
